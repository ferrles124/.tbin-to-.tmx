name: TBIN to TMX Converter

on:
  push:
    paths:
      - '**.tbin'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Dönüştürücü Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/Platypus/tbin.git || pip install structlog

      - name: Dosyaları Dönüştür
        run: |
          python -c "
          import os, glob
          try:
              from tbin import TbinMap
              for f in glob.glob('*.tbin'):
                  m = TbinMap.from_file(f)
                  m.to_tmx(f.replace('.tbin', '.tmx'))
                  print(f'Donusturuldu: {f}')
          except Exception as e:
              print(f'Hata: {e}')
          "

      - name: Dönüştürülen TMX Dosyalarını Repoya Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.tmx
          git commit -m "TBIN dosyaları TMX formatına dönüştürüldü" || exit 0
          git push
          
