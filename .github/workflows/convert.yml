name: TBIN to TMX Converter

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y tiled xvfb libgl1 libglx-mesa0

      - name: Tiled ile TBIN -> TMX Dönüştürme
        run: |
          for file in *.tbin; do
            if [ -f "$file" ]; then
              out="${file%.tbin}.tmx"
              echo "Dönüştürülüyor: $file -> $out"
              xvfb-run -a tiled --export-map "$file" "$out" || true
            fi
          done

      - name: Log ve Oluşan Dosyaları Listele
        run: |
          echo "Dizindeki Dosyalar:"
          ls -la

      - name: TMX Dosyalarını Artifact Olarak Yükle (İndirilebilir Yap)
        uses: actions/upload-artifact@v4
        with:
          name: tmx-files
          path: "*.tmx"
          if-no-files-found: ignore

      - name: Oluşan TMX Dosyalarını Repoya Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ls *.tmx 1> /dev/null 2>&1; then
            git add *.tmx
            git commit -m "Otomatik TBIN -> TMX dönüştürme" || exit 0
            git push
          else
            echo "UYARI: Dönüştürülen TMX dosyası bulunamadı."
          fi
          
