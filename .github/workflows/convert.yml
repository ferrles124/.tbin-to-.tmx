name: TBIN to TMX Converter

on:
  push:
    paths:
      - '**.tbin'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Mono ve Tiled Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete tiled

      - name: Dönüştürme Betiğini Çalıştır
        run: |
          for file in *.tbin; do
            if [ -f "$file" ]; then
              echo "Dönüştürülüyor: $file"
              tiled --export-map "$file" "${file%.tbin}.tmx" || echo "Tiled CLI ile dönüştürülemedi, alternatif deneniyor..."
            fi
          done

      - name: Oluşan TMX Dosyalarını Kontrol Et ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Eğer tmx dosyası oluştuysa git'e ekle
          if ls *.tmx 1> /dev/null 2>&1; then
            git add *.tmx
            git commit -m "TBIN dosyaları TMX formatına dönüştürüldü"
            git push
          else
            echo "HATA: Dönüştürülen TMX dosyası bulunamadı."
            exit 1
          fi
          
