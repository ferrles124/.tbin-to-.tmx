name: TBIN to TMX Converter

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: .NET SDK Kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: TBIN Dönüştürücü Betiğini Çalıştır
        run: |
          cat << 'EOF' > convert.py
          import urllib.request
          import os, glob

          # Platypus tbin dönüştürücü aracını doğrudan indirip çalıştırıyoruz
          url = "https://raw.githubusercontent.com/Platypus/tbin/master/tbin.py"
          try:
              urllib.request.urlretrieve(url, "tbin_core.py")
              print("Çekirdek dönüştürücü indirildi.")
          except Exception as e:
              print(f"İndirme hatası: {e}")

          import tbin_core

          for file in glob.glob("*.tbin"):
              try:
                  print(f"İşleniyor: {file}")
                  m = tbin_core.TbinMap.from_file(file)
                  out = file.rsplit('.', 1)[0] + '.tmx'
                  m.to_tmx(out)
                  print(f"BAŞARILI: {out} oluşturuldu!")
              except Exception as e:
                  print(f"HATA ({file}): {e}")
          EOF
          python3 convert.py

      - name: Dizin Kontrolü ve Log
        run: |
          echo "=== KLASÖRDEKİ DOSYALAR ==="
          ls -la

      - name: TMX Dosyalarını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: tmx-files
          path: "*.tmx"
          if-no-files-found: ignore

      - name: Oluşan TMX Dosyalarını Repoya Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ls *.tmx 1> /dev/null 2>&1; then
            git add *.tmx
            git commit -m "Otomatik TBIN -> TMX dönüştürme" || exit 0
            git push
          else
            echo "TMX dosyası üretilemedi."
            exit 1
          fi
          
