name: TBIN to TMX Converter

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Python ve Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Stardew Valley TBIN -> TMX Dönüştürücüyü İndir
        run: |
          git clone https://github.com/Platypus/tbin.git tbin_lib || true

      - name: Python Betiği ile Dönüştür
        run: |
          python -c "
          import os, glob, sys
          sys.path.append('tbin_lib')
          try:
              from tbin import TbinMap
              for file in glob.glob('*.tbin'):
                  print(f'Islem yapiliyor: {file}')
                  m = TbinMap.from_file(file)
                  out_name = file.rsplit('.', 1)[0] + '.tmx'
                  m.to_tmx(out_name)
                  print(f'Basariyla olusturuldu: {out_name}')
          except Exception as e:
              print(f'Hata olustu: {e}')
          "

      - name: Dizin İçeriğini Göster (Hata Ayıklama)
        run: |
          echo "=== KLASÖRDEKİ DOSYALAR ==="
          ls -la

      - name: TMX Dosyalarını Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: tmx-files
          path: "*.tmx"
          if-no-files-found: ignore

      - name: Oluşan TMX Dosyalarını Repoya Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ls *.tmx 1> /dev/null 2>&1; then
            git add *.tmx
            git commit -m "Otomatik TBIN -> TMX dönüştürme" || exit 0
            git push
          else
            echo "TMX dosyası üretilemedi."
          fi
          
